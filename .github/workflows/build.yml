name: 👻 Ghost Assist Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Select Platform to Build'
        required: true
        default: 'Both'
        type: choice
        options:
          - Windows
          - macOS
          - Both

jobs:
  build-windows:
    name: Build Windows
    if: github.event.inputs.platform == 'Windows' || github.event.inputs.platform == 'Both'
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🛠 Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: 🏗 Build Release
        run: flutter build windows --release

      - name: 📂 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghost-assist-windows
          path: build/windows/x64/runner/Release
          retention-days: 7

  build-macos:
    name: Build macOS
    if: github.event.inputs.platform == 'macOS' || github.event.inputs.platform == 'Both'
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🏗 Build Release
        run: |
          flutter build macos --release
          cd build/macos/Build/Products/Release
          zip -r ../../../../ghost-assist-macos.zip .

      - name: 📂 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghost-assist-macos
          path: ghost-assist-macos.zip
          retention-days: 7
