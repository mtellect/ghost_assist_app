name: 👻 Ghost Assist Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Select Platform to Build'
        required: true
        default: 'Both'
        type: choice
        options:
          - Windows
          - macOS
          - Both

jobs:
  build-windows:
    name: Build Windows
    if: github.event.inputs.platform == 'Windows' || github.event.inputs.platform == 'Both'
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🛠 Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: 🏗 Build Release
        run: flutter build windows --release --verbose

      - name: 🚨 Dump CMake Install Logs on Failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path "build\windows\x64\cmake_install.cmake") {
            Write-Host "=== Rerunning cmake_install.cmake to capture raw errors ==="
            & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe" -DBUILD_TYPE=Release -P build\windows\x64\cmake_install.cmake
          } else {
            Write-Host "cmake_install.cmake not found."
          }


      - name: 📦 Create MSIX Installer
        run: flutter pub run msix:create

      - name: 📂 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghost-assist-windows-installer
          path: build\windows\x64\runner\Release\*.msix
          retention-days: 7

      - name: 📦 Archive Portable Release (ZIP)
        shell: pwsh
        run: |
          Get-ChildItem -Path build\windows\x64\runner\Release | Compress-Archive -DestinationPath ghost-assist-windows.zip

      - name: 📂 Upload Portable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghost-assist-windows-portable
          path: ghost-assist-windows.zip
          retention-days: 7

  build-macos:
    name: Build macOS
    if: github.event.inputs.platform == 'macOS' || github.event.inputs.platform == 'Both'
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🏗 Build Release
        run: |
          flutter build macos --release
          zip -r ghost-assist-macos.zip build/macos/Build/Products/Release/ghost_assist_app.app

      - name: 📂 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghost-assist-macos
          path: ghost-assist-macos.zip
          retention-days: 7
